<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f6f1" />
    <meta name="description" content="Find rooms, furniture, stationery and second-hand student essentials with RoomOra." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="RoomOra" />
    <link rel="icon" type="image/svg+xml" href="/roomora-icon.svg" />
    <link rel="apple-touch-icon" href="/roomora-icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>RoomOra — Find your next room</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ("serviceWorker" in navigator && location.protocol !== "file:") {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("/sw.js").catch((error) => {
            console.warn("RoomOra offline support could not be enabled.", error);
          });
        });
      }
    </script>
  </body>
</html>
